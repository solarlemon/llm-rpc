syntax="proto3";

package llm_rpc.example; // 在c++中相当于命名空间，在多人开发下保证命名不会冲突。

option cc_generic_services=true;

message ResultCode{
    int32 errcode=1;
    bytes errmsg=2;
}
message LoginRequest{
    bytes name=1;
    bytes pwd=2;
}
message LoginResponse{
    ResultCode result=1;
    bool success=2;
}

message RegisterRequest{
    uint32 id=1;
    bytes name=2;
    bytes pwd=3;
}
message RegisterResponse{
    ResultCode result=1;
    bool success=2;
}

// 服务定义（RPC 接口）
service UserServiceRpc{
    rpc Login(LoginRequest) returns(LoginResponse); // 登录 RPC 方法
    rpc Register(RegisterRequest) returns(RegisterResponse); // 注册 RPC 方法
}
